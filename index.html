function search(query) {
  query = query.toLowerCase().trim();
  let results = knowledgeBase;

  // Category filter
  if (activeCat !== "all") {
    results = results.filter(item => item.urgency === activeCat || item.cat === activeCat);
  }

  // Text search
  if (query) {
    const keywords = query.split(/\s+/);
    results = results.filter(item => {
      const searchText = [
        item.name, item.symptoms, item.usFindings,
        item.differential, item.key, item.subcat, item.severity
      ].join(" ").toLowerCase();
      return keywords.every(kw => searchText.includes(kw));
    });
  }

  // Sort: urgency first, then by relevance
  const urgencyOrder = { "危重":0, "重度":1, "中度":2, "中轻度":3, "轻度":4 };
  results.sort((a,b) => (urgencyOrder[a.urgency]||5) - (urgencyOrder[b.urgency]||5));

  return results;
}

function renderResults(results) {
  const container = document.getElementById("results");
  const countEl = document.getElementById("resultCount");

  countEl.textContent = `找到 ${results.length} 个匹配诊断`;

  if (results.length === 0) {
    container.innerHTML = `
      <div class="no-result">
        <div class="icon">🔍</div>
        <p>未找到匹配的诊断</p>
        <p style="font-size:.85em;margin-top:8px;">试试：低回声、血流增多、撕裂、积液、钙化…</p>
      </div>`;
    return;
  }

  container.innerHTML = results.map(r => `
    <div class="card ${r.cat}">
      <h3>
        ${r.name}
        <span class="badge ${r.cat}">${r.cat}</span>
        ${r.urgency === '急症' || r.urgency === '危重' ? `<span class="badge 急症">🚨${r.urgency}</span>` : ''}
      </h3>
      <div class="section">
        <div class="section-title">🩺 临床表现</div>
        <div class="section-content">${highlightMatches(r.symptoms)}</div>
      </div>
      <div class="section">
        <div class="section-title">🔬 超声表现</div>
        <div class="section-content">${highlightMatches(r.usFindings)}</div>
      </div>
      <div class="section">
        <div class="section-title">🔄 鉴别诊断</div>
        <div class="section-content">${r.differential}</div>
      </div>
      <div class="section">
        <div class="section-title">🔑 关键提示</div>
        <div class="section-content">${highlightMatches(r.key)}</div>
      </div>
      <div style="margin-top:6px;font-size:.7em;color:#999;">严重程度：${r.severity} | 分类：${r.subcat}</div>
    </div>
  `).join("");
}

function highlightMatches(text) {
  const query = document.getElementById("searchInput").value.trim();
  if (!query) return text;
  const keywords = query.split(/\s+/);
  let result = text;
  keywords.forEach(kw => {
    const regex = new RegExp(`(${kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
    result = result.replace(regex, '<span class="highlight">$1</span>');
  });
  return result;
}

// ========== Event Listeners ==========
document.getElementById("searchInput").addEventListener("input", function() {
  renderResults(search(this.value));
});

document.getElementById("tagFilters").addEventListener("click", function(e) {
  if (e.target.classList.contains("tag")) {
    document.querySelectorAll(".tag").forEach(t => t.classList.remove("active"));
    e.target.classList.add("active");
    activeCat = e.target.dataset.cat;
    renderResults(search(document.getElementById("searchInput").value));
  }
});

// ========== Init ==========
renderResults(search(""));

// Keyboard shortcut: / to focus search
document.addEventListener("keydown", function(e) {
  if (e.key === "/" && document.activeElement !== document.getElementById("searchInput")) {
    e.preventDefault();
    document.getElementById("searchInput").focus();
  }
});
</script>
